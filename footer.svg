<svg width="900" height="140" viewBox="0 0 900 140" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .scroll-text { font-family: 'Courier New', monospace; font-size: 13px; fill: #00d9ff; letter-spacing: 2px; }
      .scroll-text-dim { font-family: 'Courier New', monospace; font-size: 13px; fill: #607080; letter-spacing: 2px; }
    </style>
    <clipPath id="ticker-clip">
      <rect x="0" y="55" width="900" height="30"/>
    </clipPath>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="140" class="bg"/>

  <!-- Wave 1 (back) -->
  <path fill="#0a1a2e" opacity="0.6">
    <animate attributeName="d" dur="6s" repeatCount="indefinite"
      values="
        M0,40 C150,20 300,60 450,40 C600,20 750,60 900,40 L900,140 L0,140 Z;
        M0,50 C150,70 300,30 450,50 C600,70 750,30 900,50 L900,140 L0,140 Z;
        M0,40 C150,20 300,60 450,40 C600,20 750,60 900,40 L900,140 L0,140 Z
      "/>
  </path>

  <!-- Wave 2 (mid) -->
  <path fill="#0d2137" opacity="0.7">
    <animate attributeName="d" dur="4.5s" repeatCount="indefinite"
      values="
        M0,55 C200,35 400,75 600,55 C750,40 850,65 900,55 L900,140 L0,140 Z;
        M0,65 C200,80 400,45 600,65 C750,80 850,50 900,65 L900,140 L0,140 Z;
        M0,55 C200,35 400,75 600,55 C750,40 850,65 900,55 L900,140 L0,140 Z
      "/>
  </path>

  <!-- Wave 3 (front) -->
  <path fill="#0d1117" opacity="0.9">
    <animate attributeName="d" dur="3.5s" repeatCount="indefinite"
      values="
        M0,72 C100,58 250,85 450,70 C650,55 800,80 900,70 L900,140 L0,140 Z;
        M0,80 C100,92 250,65 450,80 C650,92 800,68 900,80 L900,140 L0,140 Z;
        M0,72 C100,58 250,85 450,70 C650,55 800,80 900,70 L900,140 L0,140 Z
      "/>
  </path>

  <!-- Glowing top border line -->
  <line x1="0" y1="1" x2="900" y2="1" stroke="#00d9ff" stroke-width="1" opacity="0.3"/>

  <!-- Scrolling ticker text -->
  <g clip-path="url(#ticker-clip)">
    <text y="74" class="scroll-text" filter="url(#glow)">
      <animate attributeName="x" from="900" to="-2200" dur="18s" repeatCount="indefinite"/>
      ⚡ ALWAYS LEARNING  ·  ALWAYS BUILDING  ·  ALWAYS SECURING  🔐  ·  AI-DRIVEN CYBERSECURITY  ·  ZERO-TRUST ARCHITECTURE  ·  RAG PIPELINES  ·  OPEN TO OPPORTUNITIES  ·  loichianghao.vercel.app  ·
    </text>
    <!-- Second copy so it loops seamlessly -->
    <text y="74" class="scroll-text" filter="url(#glow)">
      <animate attributeName="x" from="2900" to="-200" dur="18s" repeatCount="indefinite"/>
      ⚡ ALWAYS LEARNING  ·  ALWAYS BUILDING  ·  ALWAYS SECURING  🔐  ·  AI-DRIVEN CYBERSECURITY  ·  ZERO-TRUST ARCHITECTURE  ·  RAG PIPELINES  ·  OPEN TO OPPORTUNITIES  ·  loichianghao.vercel.app  ·
    </text>
  </g>

  <!-- Bottom credits -->
  <text x="450" y="115" font-family="'Courier New', monospace" font-size="11px" fill="#3a4a5a" text-anchor="middle">
    © 2026 LOI CHIANG HAO  ·  Built with Next.js &amp; AI  ·  UTAR 2022–2026
  </text>

  <!-- Corner dots -->
  <circle cx="20" cy="20" r="2" fill="#00d9ff" opacity="0.5"/>
  <circle cx="880" cy="20" r="2" fill="#00d9ff" opacity="0.5"/>
</svg>
