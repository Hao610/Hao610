    <animate attributeName="y1" values="10;310;10" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="10;310;10" dur="4s" repeatCount="indefinite"/>
  </line>

  <!-- Outer border -->
  <rect x="10" y="10" width="880" height="300" rx="4" class="border"/>

  <!-- Top bar -->
  <rect x="10" y="10" width="880" height="28" rx="4" fill="#0a1a24"/>
  <rect x="10" y="28" width="880" height="10" fill="#0a1a24"/>
  <circle cx="30" cy="24" r="5" fill="#ff5f57"/>
  <circle cx="46" cy="24" r="5" fill="#febc2e"/>
  <circle cx="62" cy="24" r="5" fill="#28c840"/>
  <text x="440" y="28" font-family="'Courier New', monospace" font-size="11px" fill="#3a5a6a" text-anchor="middle">PROFILE.SYS — READ ONLY</text>

