<svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .border { stroke: #1a3a4a; stroke-width: 1; fill: none; }
      .label { font-family: 'Courier New', monospace; font-size: 11px; fill: #00d9ff; letter-spacing: 1px; }
      .value { font-family: 'Courier New', monospace; font-size: 11px; fill: #c9d1d9; }
      .dim   { font-family: 'Courier New', monospace; font-size: 11px; fill: #3a5a6a; }
      .tag   { font-family: 'Courier New', monospace; font-size: 10px; fill: #00d9ff; opacity: 0.5; }
      .section { font-family: 'Courier New', monospace; font-size: 10px; fill: #00ff88; letter-spacing: 2px; }
      .focus { font-family: 'Courier New', monospace; font-size: 11px; fill: #a0c4d8; }
      .philosophy { font-family: 'Courier New', monospace; font-size: 12px; fill: #00d9ff; font-style: italic; }
    </style>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="panel-clip">
      <rect x="10" y="10" width="880" height="300" rx="4"/>
    </clipPath>
  </defs>

  <!-- Background -->
