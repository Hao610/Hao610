<svg width="900" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .label { font-family: 'Courier New', monospace; font-size: 11px; fill: #a0aec0; }
      .val   { font-family: 'Courier New', monospace; font-size: 11px; fill: #00d9ff; font-weight: bold; }
      .title { font-family: 'Courier New', monospace; font-size: 10px; fill: #00ff88; letter-spacing: 2px; }
      .border { stroke: #1a3a4a; stroke-width: 1; fill: none; }
    </style>
  </defs>

  <rect width="900" height="200" class="bg"/>
  <rect x="10" y="10" width="880" height="180" rx="4" class="border"/>

  <!-- Title -->
  <text x="450" y="32" class="title" text-anchor="middle">TECH_PROFICIENCY_MATRIX</text>
  <line x1="25" y1="40" x2="875" y2="40" stroke="#1a3a4a" stroke-width="1"/>

  <!-- Col 1: Languages -->
  <text x="60" y="60" class="title">LANGUAGES</text>
  <!-- Python -->
  <text x="30" y="80" class="label">Python</text>
  <rect x="100" y="69" width="120" height="8" rx="2" fill="#0a2030"/>
  <rect x="100" y="69" width="0" height="8" rx="2" fill="#00d9ff" opacity="0.8">
    <animate attributeName="width" from="0" to="112" dur="1s" begin="0.2s" fill="freeze"/>
  </rect>
  <text x="226" y="78" class="val">95%</text>

  <!-- TypeScript -->
  <text x="30" y="98" class="label">TypeScript</text>
  <rect x="100" y="87" width="120" height="8" rx="2" fill="#0a2030"/>
  <rect x="100" y="87" width="0" height="8" rx="2" fill="#00d9ff" opacity="0.8">
    <animate attributeName="width" from="0" to="100" dur="1s" begin="0.4s" fill="freeze"/>
  </rect>
  <text x="226" y="96" class="val">83%</text>

  <!-- Kotlin -->
  <text x="30" y="116" class="label">Kotlin</text>
  <rect x="100" y="105" width="120" height="8" rx="2" fill="#0a2030"/>
  <rect x="100" y="105" width="0" height="8" rx="2" fill="#00d9ff" opacity="0.8">
    <animate attributeName="width" from="0" to="84" dur="1s" begin="0.6s" fill="freeze"/>
  </rect>
  <text x="226" y="114" class="val">70%</text>

  <!-- JavaScript -->
  <text x="30" y="134" class="label">JavaScript</text>
  <rect x="100" y="123" width="120" height="8" rx="2" fill="#0a2030"/>
  <rect x="100" y="123" width="0" height="8" rx="2" fill="#00d9ff" opacity="0.8">
    <animate attributeName="width" from="0" to="96" dur="1s" begin="0.8s" fill="freeze"/>
  </rect>
  <text x="226" y="132" class="val">80%</text>

  <!-- Col divider -->
  <line x1="270" y1="45" x2="270" y2="185" stroke="#1a3a4a" stroke-width="1"/>

  <!-- Col 2: Frameworks -->
  <text x="330" y="60" class="title">FRAMEWORKS</text>
  <text x="285" y="80" class="label">Next.js</text>
  <rect x="355" y="69" width="120" height="8" rx="2" fill="#0a2030"/>
  <rect x="355" y="69" width="0" height="8" rx="2" fill="#00ff88" opacity="0.8">
    <animate attributeName="width" from="0" to="108" dur="1s" begin="0.3s" fill="freeze"/>
  </rect>
  <text x="481" y="78" class="val" fill="#00ff88">90%</text>

  <text x="285" y="98" class="label">React</text>
  <rect x="355" y="87" width="120" height="8" rx="2" fill="#0a2030"/>
  <rect x="355" y="87" width="0" height="8" rx="2" fill="#00ff88" opacity="0.8">
    <animate attributeName="width" from="0" to="108" dur="1s" begin="0.5s" fill="freeze"/>
  </rect>
  <text x="481" y="96" class="val" fill="#00ff88">90%</text>

  <text x="285" y="116" class="label">FastAPI</text>
  <rect x="355" y="105" width="120" height="8" rx="2" fill="#0a2030"/>
  <rect x="355" y="105" width="0" height="8" rx="2" fill="#00ff88" opacity="0.8">
    <animate attributeName="width" from="0" to="96" dur="1s" begin="0.7s" fill="freeze"/>
  </rect>
  <text x="481" y="114" class="val" fill="#00ff88">80%</text>

  <text x="285" y="134" class="label">Flask</text>
  <rect x="355" y="123" width="120" height="8" rx="2" fill="#0a2030"/>
  <rect x="355" y="123" width="0" height="8" rx="2" fill="#00ff88" opacity="0.8">
    <animate attributeName="width" from="0" to="84" dur="1s" begin="0.9s" fill="freeze"/>
  </rect>
  <text x="481" y="132" class="val" fill="#00ff88">70%</text>

  <!-- Col divider -->
  <line x1="525" y1="45" x2="525" y2="185" stroke="#1a3a4a" stroke-width="1"/>

  <!-- Col 3: Security & AI -->
  <text x="580" y="60" class="title">SECURITY / AI</text>
  <text x="540" y="80" class="label">ML/Scikit</text>
  <rect x="615" y="69" width="120" height="8" rx="2" fill="#0a2030"/>
  <rect x="615" y="69" width="0" height="8" rx="2" fill="#ff6b6b" opacity="0.8">
    <animate attributeName="width" from="0" to="104" dur="1s" begin="0.4s" fill="freeze"/>
  </rect>
  <text x="741" y="78" class="val" fill="#ff6b6b">87%</text>

  <text x="540" y="98" class="label">Pen Test</text>
  <rect x="615" y="87" width="120" height="8" rx="2" fill="#0a2030"/>
  <rect x="615" y="87" width="0" height="8" rx="2" fill="#ff6b6b" opacity="0.8">
    <animate attributeName="width" from="0" to="88" dur="1s" begin="0.6s" fill="freeze"/>
  </rect>
  <text x="741" y="96" class="val" fill="#ff6b6b">73%</text>

  <text x="540" y="116" class="label">RAG/LLM</text>
  <rect x="615" y="105" width="120" height="8" rx="2" fill="#0a2030"/>
  <rect x="615" y="105" width="0" height="8" rx="2" fill="#ff6b6b" opacity="0.8">
    <animate attributeName="width" from="0" to="96" dur="1s" begin="0.8s" fill="freeze"/>
  </rect>
  <text x="741" y="114" class="val" fill="#ff6b6b">80%</text>

  <text x="540" y="134" class="label">Networking</text>
  <rect x="615" y="123" width="120" height="8" rx="2" fill="#0a2030"/>
  <rect x="615" y="123" width="0" height="8" rx="2" fill="#ff6b6b" opacity="0.8">
    <animate attributeName="width" from="0" to="92" dur="1s" begin="1.0s" fill="freeze"/>
  </rect>
  <text x="741" y="132" class="val" fill="#ff6b6b">77%</text>

  <!-- Col divider -->
  <line x1="780" y1="45" x2="780" y2="185" stroke="#1a3a4a" stroke-width="1"/>

  <!-- Col 4: Tools mini badges -->
  <text x="800" y="60" class="title">TOOLS</text>
  <text x="793" y="78"  class="label" font-size="10px">Supabase ✓</text>
  <text x="793" y="94"  class="label" font-size="10px">Redis ✓</text>
  <text x="793" y="110" class="label" font-size="10px">Vercel ✓</text>
  <text x="793" y="126" class="label" font-size="10px">Sanity ✓</text>
  <text x="793" y="142" class="label" font-size="10px">Node-RED ✓</text>
  <text x="793" y="158" class="label" font-size="10px">Wireshark ✓</text>

  <!-- Bottom note -->
  <text x="450" y="178" font-family="'Courier New', monospace" font-size="9px" fill="#2a4a5a" text-anchor="middle">// self-assessed proficiency · updated 2026</text>
</svg>
